# Shared checks for caldera-platform (TypeScript, decision 0004 in caldera-handbook):
# lint, type check, unit tests, integration tests against a real PostgreSQL, a dependency audit,
# and a build of every service's container image, on every pull request and push.
# [Open] Image vulnerability scanning is added with the deployment pipeline.
name: Platform CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platform:
    name: Lint, type check, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same pinned PostgreSQL 18 image as caldera-platform's Infrastructure/Local/compose.yaml.
        # Test-only database with no password, reachable only from this job.
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: caldera
          POSTGRES_DB: caldera
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caldera"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from package.json)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests (real PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://caldera@localhost:5432/caldera
        run: pnpm run test:integration

      - name: Dependency audit (high and critical fail the build)
        run: pnpm audit --audit-level high

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build every service image
        run: |
          set -euo pipefail
          found=0
          for dockerfile in Source/Backend/*/Dockerfile; do
            [ -e "$dockerfile" ] || continue
            found=1
            # Image names must be lowercase; folder names are PascalCase.
            unit=$(basename "$(dirname "$dockerfile")" | tr '[:upper:]' '[:lower:]')
            echo "::group::$unit"
            docker build --file "$dockerfile" --tag "caldera/$unit:ci" .
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then echo "::notice::No service images to build yet."; fi
