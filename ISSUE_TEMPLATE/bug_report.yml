name: Bug report
description: Something in Caldera does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to…\n2. Do…\n3. See…"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [NA server, EU server, Test server, Website, Discord bot]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [PC, Xbox, PS5, Not in game]
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video or logs
