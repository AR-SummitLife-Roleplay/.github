name: Feature request
description: An idea or change for SummitLife.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
